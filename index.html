<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宣導/告知/訓練 現場簽核</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #modalSigCanvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex justify-center items-center font-sans">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-md p-6 space-y-5 my-4">
    
    <!-- 1. 訓練資訊與內容區 -->
    <div class="border-b pb-4 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full" id="categoryBadge">
          宣導/告知/訓練
        </span>
        <span class="text-xs text-slate-400">線上無紙化</span>
      </div>
      
      <h1 class="text-xl font-bold text-slate-800" id="courseTitle">載入中...</h1>
      
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3.5 text-sm text-slate-800 space-y-2">
        <p class="font-bold text-amber-900 flex items-center gap-1">
          <span>⚠️</span> 宣導/告知/訓練 重點項目：
        </p>
        <div id="courseContent" class="whitespace-pre-line leading-relaxed text-sm">
          正在從雲端載入內容...
        </div>
      </div>

      <!-- 2. 教材圖片展示區 (最多 8 張) -->
      <div id="imageGallery" class="hidden space-y-3 pt-2">
        <p class="text-xs font-bold text-slate-600">說明圖示與規範照片：</p>
        <div id="imageList" class="space-y-3"></div>
      </div>
    </div>

    <!-- 3. 學員簽認表單 -->
    <form id="signForm" class="space-y-4">
      
      <div>
        <label for="empId" class="block text-xs font-semibold text-slate-700 mb-1">人員 ID <span class="text-red-500">*</span></label>
        <input type="text" id="empId" placeholder="輸入人員 ID (如 E1001)" required class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label for="name" class="block text-xs font-semibold text-slate-700 mb-1">同仁姓名 <span class="text-red-500">*</span></label>
        <input type="text" id="name" placeholder="輸入 ID 後自動帶出姓名" required class="w-full rounded-lg border border-slate-300 p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- 彈跳手寫簽名入口 -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">本人親筆手寫簽名 <span class="text-red-500">*</span></label>
        
        <!-- 尚未簽名狀態 -->
        <button type="button" id="openSignModalBtn" class="w-full py-3 border-2 border-dashed border-blue-400 bg-blue-50 text-blue-700 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 hover:bg-blue-100">
          <span>✍️</span> 點此開啟全螢幕簽名板
        </button>

        <!-- 簽完名預覽狀態 (預設隱藏) -->
        <div id="signedPreviewBox" class="hidden border rounded-xl p-2 bg-slate-50 flex items-center justify-between">
          <img id="sigPreviewImg" class="h-12 max-w-[180px] object-contain border bg-white rounded" />
          <button type="button" id="reSignBtn" class="text-xs text-blue-600 underline px-2">重簽</button>
        </div>
      </div>

      <div class="pt-1">
        <label class="flex items-start gap-2 cursor-pointer">
          <input id="agreeCheck" type="checkbox" required class="h-4 w-4 mt-0.5 text-blue-600 rounded border-slate-300">
          <span class="text-xs text-slate-600 leading-tight">我已確實閱讀並完整理解上述宣導/告知/訓練內容，承諾落實執行。</span>
        </label>
      </div>

      <!-- 送出按鈕 (全填完才亮綠色) -->
      <button type="submit" id="submitBtn" disabled class="w-full bg-slate-300 text-slate-500 font-bold py-3.5 rounded-xl transition cursor-not-allowed">
        請完成所有欄位與親筆簽名
      </button>
    </form>

    <!-- 送出成功提示 -->
    <div id="successMsg" class="hidden text-center py-8 space-y-2">
      <div class="text-emerald-500 text-5xl font-bold">✓</div>
      <h2 class="text-xl font-bold text-slate-800">已完成簽認！</h2>
      <p class="text-xs text-slate-500">紀錄與手寫簽名已存入活頁簿。<br>您可以關閉本視窗。</p>
    </div>

  </div>

  <!-- 全螢幕彈跳簽名 Modal -->
  <div id="sigModal" class="fixed inset-0 bg-black/70 z-50 hidden flex flex-col justify-center items-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-4 flex flex-col space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <span class="font-bold text-slate-800 text-sm">請使用手指或觸控筆在下方簽名</span>
        <button type="button" id="modalClearBtn" class="text-xs text-red-500 hover:text-red-700 underline">清除重寫</button>
      </div>

      <div class="border-2 border-slate-300 rounded-xl bg-slate-50 overflow-hidden">
        <canvas id="modalSigCanvas" width="500" height="240" class="w-full bg-white"></canvas>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <button type="button" id="modalCancelBtn" class="py-2.5 bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold">取消</button>
        <button type="button" id="modalSaveBtn" class="py-2.5 bg-blue-600 text-white rounded-lg text-sm font-semibold">保存簽名</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyGT6xpXAsads6FAzH8bmh9fQeJ69PNT2pkN6lq3Ceth1YhX9z_gct7RLN6qBy4udRk/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('f');

    let courseRoster = {}; // ID 對照表
    let savedSignatureBase64 = ""; // 暫存手寫簽名

    // 1. 開頁自動載入課程內容、教材圖片與人員名冊
    async function loadCourse() {
      if (!fileId) {
        document.getElementById("courseTitle").innerText = "未指定課程";
        document.getElementById("courseContent").innerText = "請掃描正確的專屬 QR Code。";
        return;
      }

      try {
        const res = await fetch(`${GAS_URL}?action=getCourseDetail&fileId=${fileId}`);
        const data = await res.json();
        if (data.status === "success") {
          document.getElementById("courseTitle").innerText = data.info.title;
          document.getElementById("categoryBadge").innerText = data.info.category;
          document.getElementById("courseContent").innerText = data.info.content;
          courseRoster = data.roster || {};

          // 載入圖片 (若有)
          if (data.info.images && data.info.images.length > 0) {
            const gallery = document.getElementById("imageGallery");
            const list = document.getElementById("imageList");
            gallery.classList.remove("hidden");
            list.innerHTML = "";
            data.info.images.forEach(img => {
              const item = document.createElement("div");
              item.className = "border rounded-xl overflow-hidden bg-slate-50";
              item.innerHTML = `
                <img src="${img.url}" class="w-full max-h-56 object-cover" />
                ${img.note ? `<p class="p-2 text-xs text-slate-600">${img.note}</p>` : ''}
              `;
              list.appendChild(item);
            });
          }
        }
      } catch (err) {
        document.getElementById("courseContent").innerText = "無法載入訓練資訊，請檢查網路連線。";
      }
    }
    loadCourse();

    // 2. 輸入 ID 自動帶出姓名
    document.getElementById("empId").addEventListener("input", function(e) {
      const val = e.target.value.trim();
      if (courseRoster[val]) {
        document.getElementById("name").value = courseRoster[val];
      }
      validateForm();
    });

    document.getElementById("name").addEventListener("input", validateForm);
    document.getElementById("agreeCheck").addEventListener("change", validateForm);

    // 3. 彈跳全螢幕手寫簽名板邏輯
    const sigModal = document.getElementById("sigModal");
    const openBtn = document.getElementById("openSignModalBtn");
    const reSignBtn = document.getElementById("reSignBtn");
    const cancelBtn = document.getElementById("modalCancelBtn");
    const saveBtn = document.getElementById("modalSaveBtn");
    const clearBtn = document.getElementById("modalClearBtn");

    const canvas = document.getElementById("modalSigCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false, hasDrawn = false;

    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    function start(e) { isDrawing = true; hasDrawn = true; const p = getCanvasPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!isDrawing) return; const p = getCanvasPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function end() { isDrawing = false; }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); start(e); }, { passive: false });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); move(e); }, { passive: false });
    window.addEventListener("touchend", end);

    openBtn.addEventListener("click", () => { sigModal.classList.remove("hidden"); });
    reSignBtn.addEventListener("click", () => { sigModal.classList.remove("hidden"); });
    cancelBtn.addEventListener("click", () => { sigModal.classList.add("hidden"); });

    clearBtn.addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
    });

    saveBtn.addEventListener("click", () => {
      if (!hasDrawn) {
        alert("請在簽名板上書寫簽名後再保存！");
        return;
      }
      savedSignatureBase64 = canvas.toDataURL("image/png");
      document.getElementById("sigPreviewImg").src = savedSignatureBase64;
      document.getElementById("openSignModalBtn").classList.add("hidden");
      document.getElementById("signedPreviewBox").classList.remove("hidden");
      sigModal.classList.add("hidden");
      validateForm();
    });

    // 4. 動態欄位檢查 (全滿才變綠色)
    function validateForm() {
      const idVal = document.getElementById("empId").value.trim();
      const nameVal = document.getElementById("name").value.trim();
      const agree = document.getElementById("agreeCheck").checked;
      const btn = document.getElementById("submitBtn");

      if (idVal && nameVal && agree && savedSignatureBase64) {
        btn.disabled = false;
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg cursor-pointer";
        btn.innerText = "確認閱讀完成並送出簽認";
      } else {
        btn.disabled = true;
        btn.className = "w-full bg-slate-300 text-slate-500 font-bold py-3.5 rounded-xl transition cursor-not-allowed";
        btn.innerText = "請完成所有欄位與親筆簽名";
      }
    }

    // 5. 送出簽核資料
    document.getElementById("signForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "簽認存檔中...";

      const payload = {
        action: "submitSign",
        fileId: fileId,
        empId: document.getElementById("empId").value.trim(),
        name: document.getElementById("name").value.trim(),
        signature: savedSignatureBase64
      };

      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        document.getElementById("signForm").classList.add("hidden");
        document.getElementById("successMsg").classList.remove("hidden");
      } catch (err) {
        alert("傳送異常，請確認手機網路！");
        validateForm();
      }
    });
  </script>
</body>
</html>
